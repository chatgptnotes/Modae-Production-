<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WinTrack by ModAE — Demo Prototype</title>
<meta name="description" content="WinTrack lead-to-order sales workspace. Demo prototype with fictional data.">
<meta name="theme-color" content="#ED3F2F">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WinTrack">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23ED3F2F'/%3E%3Ctext x='90' y='120' font-family='Helvetica,Arial' font-size='96' font-weight='bold' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ED3F2F'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   WinTrack — design tokens
   ============================================================ */
:root{
  --primary:#ED3F2F; --primary-d:#C7291B; --primary-l:#FDEDEB; --primary-b:#F6C3BD;
  --plum:#282828; --magenta:#ED3F2F; --orange:#F2856F; --gold:#8A8A8A;
  --navy:#282828; --stage-blue:#F1F1F2;
  --heading:#282828; --ink:#282828; --body:#3F3F3F;
  --muted:#616161; --border:#E3E3E5; --canvas:#F7F7F8; --surface:#FFFFFF;
  --green:#37A64A; --blue:#2F80ED; --amber:#D99200; --red:#D64545;
  --green-bg:#E8F6EB; --blue-bg:#E8F1FD; --amber-bg:#FBF1DC; --red-bg:#FBE9E9;
  --r-card:12px; --r-ctl:7px;
  --sp:8px;
  --sh-1:0 1px 2px rgba(24,33,47,.06),0 1px 4px rgba(24,33,47,.05);
  --sh-2:0 4px 16px rgba(24,33,47,.10);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sidebar-w:236px; --sidebar-c:72px; --header-h:60px; --bottomnav-h:58px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--canvas);font-size:14px;line-height:1.45}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.25}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}h4{font-size:13.5px}
p{margin:0 0 8px}
a{color:var(--navy)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
.skip-link{position:absolute;left:-9999px;top:0;border:none;font:inherit;cursor:pointer;background:var(--navy);color:#fff;padding:10px 16px;z-index:400;border-radius:0 0 8px 0}
.skip-link:focus{left:0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r-ctl);border:1px solid var(--border);
  background:var(--surface);color:var(--ink);cursor:pointer;font-size:13.5px;font-weight:500;line-height:1.2;text-decoration:none}
.btn:hover{background:#eef2f7}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:#0a2757}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff}
.btn-danger:hover{background:#bf3a3a}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#e9edf3}
.btn-sm{padding:4px 10px;font-size:12.5px}
.btn-xs{padding:2px 8px;font-size:11.5px}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-ctl);
  border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:#e9edf3}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);border:1px solid var(--border);border-radius:var(--r-ctl);
  padding:7px 10px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:0;border-color:var(--navy)}
label{font-size:12.5px;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
.field{margin-bottom:12px}
.field .err{color:var(--red);font-size:12px;margin-top:3px}
fieldset{border:1px solid var(--border);border-radius:var(--r-ctl);margin:0 0 12px}
legend{font-size:12.5px;font-weight:600;color:var(--muted);padding:0 6px}

/* ---------- chips, badges, pills ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip-green{background:var(--green-bg);color:#1f6b2e;border-color:#bfe4c8}.chip-green .dot{background:var(--green)}
.chip-blue{background:var(--blue-bg);color:#1d55a8;border-color:#c2d9f8}.chip-blue .dot{background:var(--blue)}
.chip-amber{background:var(--amber-bg);color:#8a5d00;border-color:#ecd9ab}.chip-amber .dot{background:var(--amber)}
.chip-red{background:var(--red-bg);color:#a02f2f;border-color:#f0c4c4}.chip-red .dot{background:var(--red)}
.chip-grey{background:#eef1f5;color:var(--muted);border-color:var(--border)}.chip-grey .dot{background:var(--muted)}
.chip-navy{background:var(--stage-blue);color:var(--navy);border-color:#bcd4ea}.chip-navy .dot{background:var(--navy)}
.chip-plum{background:#f4e3ee;color:var(--plum);border-color:#e2c0d6}.chip-plum .dot{background:var(--plum)}
.badge-demo{background:var(--gold);color:#3d2c05;font-weight:700;font-size:11px;padding:3px 9px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.badge-phase{background:#eef1f5;border:1px dashed var(--muted);color:var(--muted);font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}
.restricted{display:inline-flex;align-items:center;gap:5px;color:var(--muted);background:#eef1f5;border:1px dashed var(--border);
  border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600}
.conf{font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
.conf-hi{background:var(--green-bg);color:#1f6b2e}.conf-med{background:var(--amber-bg);color:#8a5d00}.conf-lo{background:var(--red-bg);color:#a02f2f}
.evlink{background:none;border:none;color:var(--navy);cursor:pointer;font-size:12px;text-decoration:underline dotted;padding:0}
.mono{font-family:var(--mono);font-size:12.5px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:var(--header-h) 1fr;min-height:100vh;
  grid-template-areas:"side head" "side main"}
#app.collapsed{grid-template-columns:var(--sidebar-c) 1fr}
header.app-header{grid-area:head;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;position:sticky;top:0;z-index:60}
.wordmark{display:flex;flex-direction:column;line-height:1.05;text-decoration:none;color:inherit}
.wordmark .wm-name{font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--navy)}
.wordmark .wm-sub{font-size:10px;color:var(--muted);letter-spacing:.06em}
.accentline{height:3px;width:100%;background:linear-gradient(90deg,var(--plum) 0 25%,var(--magenta) 25% 50%,var(--orange) 50% 75%,var(--gold) 75% 100%);border-radius:2px;margin-top:2px}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap input{width:100%;padding-left:32px}
.search-wrap .s-ic{position:absolute;left:9px;top:8px;color:var(--muted)}
.search-results{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--sh-2);
  max-height:320px;overflow:auto;z-index:120}
.search-results button{display:block;width:100%;text-align:left;padding:8px 12px;border:none;background:none;cursor:pointer;font-size:13px;border-bottom:1px solid #f0f2f6}
.search-results button:hover{background:var(--stage-blue)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--plum);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.popover{position:absolute;right:0;top:44px;width:320px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh-2);z-index:130;padding:10px}
.pop-wrap{position:relative}
.pop-row{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-bottom:1px solid #f0f2f6;font-size:12.5px}
.pop-row:last-child{border-bottom:none}

nav.sidebar{grid-area:side;background:var(--navy);color:#dfe8f6;display:flex;flex-direction:column;position:-webkit-sticky;position:sticky;top:0;height:100vh;z-index:70}
.side-top{padding:14px 14px 8px}
.side-nav{flex:1;overflow:auto;padding:6px}
.side-nav .nv-item{width:100%;text-align:left;border:none;background:none;font:inherit;cursor:pointer}
.side-nav a,.side-nav .nv-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#cfdcf1;text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px}
.side-nav a:hover,.side-nav .nv-item:hover{background:rgba(255,255,255,.09);color:#fff}
.side-nav a[aria-current="page"],.side-nav .nv-item[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.side-nav .nv-ic{width:20px;text-align:center;flex:none}
.side-nav .nv-count{margin-left:auto;background:var(--magenta);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;padding:1px 7px}
#app.collapsed .side-nav .nv-txt,#app.collapsed .side-nav .nv-count,#app.collapsed .side-brand-txt{display:none}
#app.collapsed .side-nav a,#app.collapsed .side-nav .nv-item{justify-content:center;padding:9px 6px}
.side-foot{padding:10px;border-top:1px solid rgba(255,255,255,.15)}
.side-brand{color:#fff;font-weight:800;font-size:16px;letter-spacing:-.01em}
.side-collapse{width:100%;background:rgba(255,255,255,.1);border:none;color:#dfe8f6;border-radius:8px;padding:7px;cursor:pointer;font-size:12px}
.side-collapse:hover{background:rgba(255,255,255,.2)}

main#main{grid-area:main;padding:20px;max-width:1440px;width:100%}
.page-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.page-head .sub{color:var(--muted);font-size:12.5px;width:100%}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-1);padding:14px}
.card h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g-12{grid-template-columns:repeat(12,1fr)}
.c-3{grid-column:span 3}.c-4{grid-column:span 4}.c-6{grid-column:span 6}.c-8{grid-column:span 8}.c-9{grid-column:span 9}.c-12{grid-column:span 12}
.kpi{cursor:pointer}
.kpi .kpi-num{font-size:26px;font-weight:800;color:var(--navy)}
.kpi .kpi-lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi:hover{border-color:var(--navy)}
.stat-list{list-style:none;margin:0;padding:0}
.stat-list li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #f0f2f6;font-size:13px}
.stat-list li:last-child{border-bottom:none}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--r-card);background:#fff}
table.tbl{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
.tbl th{position:-webkit-sticky;position:sticky;top:0;background:#f0f3f8;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;z-index:5}
.tbl th button{background:none;border:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.tbl td{padding:8px 10px;border-bottom:1px solid #f0f2f6;height:40px;vertical-align:middle}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover{background:var(--stage-blue)}
.tbl tr:last-child td{border-bottom:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:flex-end}
.filters .field{margin:0}
.filters select,.filters input{min-width:120px}

/* ---------- opportunity ---------- */
.opp-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px;box-shadow:var(--sh-1)}
.opp-head-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opp-id{font-family:var(--mono);font-weight:700;font-size:15px;background:var(--stage-blue);color:var(--navy);padding:3px 10px;border-radius:6px}
.opp-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px}
.opp-meta .m{display:flex;flex-direction:column;gap:2px}
.opp-meta .m .k{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:2px solid var(--border);margin-bottom:14px}
.tabs button{background:none;border:none;padding:9px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}
.tabs button:hover{color:var(--ink)}
.subtabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.subtabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* lifecycle stepper */
.stepper{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.step{flex:1;min-width:74px;text-align:center;font-size:10.5px;font-weight:700;padding:6px 3px;background:#eef1f5;color:var(--muted);position:relative;border-radius:4px}
.step.done{background:var(--stage-blue);color:var(--navy)}
.step.cur{background:var(--navy);color:#fff}

/* three panel */
.threepanel{display:grid;grid-template-columns:minmax(240px,1fr) minmax(320px,1.4fr) minmax(240px,1fr);gap:12px;align-items:start}
@media (max-width:1279px){.threepanel{grid-template-columns:1fr 1fr}.threepanel>*:last-child{grid-column:span 2}}
@media (max-width:1023px){.threepanel{grid-template-columns:1fr}.threepanel>*:last-child{grid-column:auto}}
.email-view{background:#fffdf5;border:1px solid #e8e2c8;border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;max-height:440px;overflow:auto}
.attach{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-top:8px;font-size:12.5px;background:#fff}
.aifield{border:1px solid var(--border);border-radius:8px;padding:9px 10px;margin-bottom:8px;background:#fff}
.aifield.f-accepted{border-color:#bfe4c8;background:#f6fcf7}
.aifield.f-rejected{border-color:#f0c4c4;background:#fdf6f6;opacity:.85}
.aifield .af-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.aifield .af-k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.aifield .af-v{font-weight:600;font-size:13.5px}
.aifield .af-actions{margin-left:auto;display:flex;gap:4px}
.aifield .af-ev{margin-top:4px}
.conflictbadge{background:var(--plum);color:#fff;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:260px;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.board-col{background:#eef1f5;border-radius:10px;padding:8px;min-height:120px}
.board-col h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 4px}
.bcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:12.5px}
.bcard:hover{border-color:var(--navy)}

/* checklist */
.check-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #f0f2f6;font-size:13px;flex-wrap:wrap}
.check-row:last-child{border-bottom:none}
.check-row .cr-name{font-weight:600;min-width:160px}
.check-row .cr-actions{margin-left:auto;display:flex;gap:5px}

/* rack layout */
.rack{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;background:#20293a;border-radius:10px;padding:12px}
.slot{background:#37415a;border:1px dashed #5a6786;border-radius:6px;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#aab6d0;font-size:10.5px;text-align:center;padding:4px;cursor:pointer;gap:3px}
.slot.filled{background:var(--stage-blue);border:1px solid var(--navy);color:var(--navy);font-weight:700}
.slot.warn{outline:2px solid var(--amber)}
.slot.sel{outline:2px solid var(--gold)}

/* timeline */
.timeline{list-style:none;margin:0;padding:0 0 0 4px;border-left:2px solid var(--stage-blue)}
.timeline li{position:relative;padding:0 0 12px 16px;font-size:12.5px}
.timeline li::before{content:"";position:absolute;left:-6px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--navy);border:2px solid #fff}
.timeline .t-when{color:var(--muted);font-size:11px}

/* toasts */
#toasts{position:fixed;bottom:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--sh-2);display:flex;gap:8px;align-items:flex-start}
.toast.t-ok{border-left:4px solid var(--green)}
.toast.t-warn{border-left:4px solid var(--amber)}
.toast.t-err{border-left:4px solid var(--red)}

/* modal / drawer */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(24,33,47,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh-2);width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal.wide{width:min(920px,100%)}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{margin:0;font-size:16px}
.modal-b{padding:16px;overflow:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer-overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(24,33,47,.35);z-index:190}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:#fff;z-index:195;box-shadow:var(--sh-2);display:flex;flex-direction:column}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.drawer-b{padding:16px;overflow:auto;flex:1}

/* skeleton */
.skel{background:linear-gradient(90deg,#eef1f5 25%,#f7f9fb 50%,#eef1f5 75%);background-size:200% 100%;animation:skel 1.1s infinite;border-radius:6px;height:14px;margin:6px 0}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* charts */
.bar-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.bar-h .bh-lbl{width:130px;flex:none;color:var(--muted);font-weight:600;text-align:right}
.bar-h .bh-track{flex:1;background:#eef1f5;border-radius:5px;height:18px;overflow:hidden;cursor:pointer}
.bar-h .bh-fill{height:100%;border-radius:5px;display:flex;align-items:center;color:#fff;font-size:10.5px;font-weight:700;padding:0 6px;min-width:24px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* portal */
#portal-shell{min-height:100vh;background:#f2f4f8;display:none}
#portal-shell.active{display:block}
#app.hidden{display:none}
.portal-head{background:linear-gradient(120deg,var(--plum),var(--magenta));color:#fff;padding:18px 16px}
.portal-wrap{max-width:640px;margin:0 auto;padding:16px}
.portal-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh-1)}

/* misc */
.hint{font-size:12px;color:var(--muted)}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.warnbox{background:var(--amber-bg);border:1px solid #ecd9ab;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7a5200;margin-bottom:10px}
.errbox{background:var(--red-bg);border:1px solid #f0c4c4;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#8f2b2b;margin-bottom:10px}
.okbox{background:var(--green-bg);border:1px solid #bfe4c8;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#1f6b2e;margin-bottom:10px}
.infbox{background:var(--stage-blue);border:1px solid #bcd4ea;border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--navy);margin-bottom:10px}
.scen-card{cursor:pointer;transition:border-color .12s}
.scen-card:hover{border-color:var(--navy)}
.launch-hero{background:linear-gradient(120deg,var(--navy),#1a4a96);color:#fff;border-radius:16px;padding:26px;margin-bottom:18px}
.launch-hero h1{font-size:26px;color:#fff}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}
.line-flags{display:flex;gap:4px;flex-wrap:wrap}
.footer-demo{margin-top:26px;padding-top:12px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px}

/* responsive */
@media (max-width:1279px){.c-3{grid-column:span 4}.c-4{grid-column:span 6}}
@media (max-width:1023px){
  #app{grid-template-columns:var(--sidebar-c) 1fr}
  .side-nav .nv-txt,.side-nav .nv-count,.side-brand-txt{display:none}
  .side-nav a{justify-content:center;padding:9px 6px}
  .c-3,.c-4,.c-6,.c-8,.c-9{grid-column:span 12}
  main#main{padding:12px}
}

/* print */
@media print{
  nav.sidebar,header.app-header,#toasts,.page-actions,.tabs,.subtabs,.btn,.no-print{display:none!important}
  #app{display:block}
  main#main{padding:0}
  body::before{content:"DEMO - NOT A COMMERCIAL OFFER · WinTrack by ModAE · Fictional demo data";
    display:block;font-weight:800;color:#a02f2f;border:2px solid #a02f2f;padding:8px;margin-bottom:12px;text-align:center}
  .card{box-shadow:none;break-inside:avoid}
}

/* ============================================================
   v2 — brand recolour, mobile-first shell, web-app chrome
   ============================================================ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--body);background:var(--canvas);overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{color:var(--heading);font-weight:700}
a{color:var(--primary)}
a:hover{color:var(--primary-d)}
button,a,label,select,input[type="checkbox"]{touch-action:manipulation}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.skip-link{background:var(--primary)}

/* ---- actions ---- */
.btn{color:var(--heading);min-height:36px;border-radius:8px;transition:background .12s,border-color .12s}
.btn:hover{background:#F1F1F2}
.btn-primary,.btn-primary:link{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d);border-color:var(--primary-d)}
.btn-danger{background:#8E1B10;border-color:#8E1B10;color:#fff}
.btn-danger:hover{background:#701108;border-color:#701108;color:#fff}
.btn-danger:disabled,.btn-danger[aria-disabled="true"]{color:#fff}
.btn-ghost:hover{background:#F1F1F2}
.btn-outline{background:#fff;border-color:var(--primary);color:var(--primary);font-weight:600}
.btn-outline:hover{background:var(--primary-l)}
.iconbtn{color:var(--heading);border-radius:10px}
.iconbtn:hover{background:#F1F1F2}
input,select,textarea{border-radius:8px;color:var(--heading);background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);border-color:var(--primary)}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) calc(50% + 1px),calc(100% - 9px) calc(50% + 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
label{color:var(--muted)}
.evlink{color:var(--primary)}

/* ---- surfaces & status ---- */
.card{border-radius:14px;border-color:var(--border)}
.chip-navy{background:var(--primary-l);color:var(--primary-d);border-color:var(--primary-b)}
.chip-navy .dot{background:var(--primary)}
.chip-plum{background:#EFEFEF;color:var(--heading);border-color:#DCDCDC}
.chip-plum .dot{background:var(--heading)}
.chip-grey{color:var(--muted)}
.badge-demo{background:var(--primary-l);color:var(--primary-d);border:1px solid var(--primary-b)}
.badge-phase{border-color:var(--muted);color:var(--muted)}
.restricted{color:var(--muted)}
.kpi .kpi-num{color:var(--heading)}
.kpi .kpi-lbl{color:var(--muted)}
.kpi:hover{border-color:var(--primary)}
.accentline{background:linear-gradient(90deg,var(--primary) 0 60%,#282828 60% 100%)}
.launch-hero{background:linear-gradient(135deg,#282828 0%,#3A3A3A 55%,var(--primary) 100%)}
.launch-hero h1,.launch-hero h2,.launch-hero h3{color:#fff}
.portal-head{background:linear-gradient(135deg,#282828,var(--primary))}
.scen-card:hover{border-color:var(--primary)}
.bcard:hover{border-color:var(--primary)}
.avatar{background:var(--primary)}
.infbox{background:var(--primary-l);border-color:var(--primary-b);color:var(--primary-d)}
.step.done{background:var(--primary-l);color:var(--primary-d)}
.step.cur{background:var(--primary);color:#fff}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.subtabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.slot.filled{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
.slot.sel{outline:2px solid var(--heading)}
.timeline{border-left-color:#E3E3E5}
.timeline li::before{background:var(--primary)}
.search-results button:hover{background:var(--primary-l)}
.side-nav a[aria-current="page"],.side-nav .nv-item[aria-current="page"]{background:var(--primary);color:#fff}
.side-nav .nv-count{background:var(--primary)}
.side-nav a[aria-current="page"] .nv-count,.side-nav .nv-item[aria-current="page"] .nv-count{background:#fff;color:var(--primary)}

/* ---- tables: readable grey body text ---- */
table.tbl{color:var(--muted)}
.tbl th{background:#FAFAFB;color:var(--muted);font-size:11px}
.tbl td{color:var(--muted)}
.tbl td strong,.tbl td b{color:var(--heading)}
.tbl tr.rowlink:hover{background:var(--primary-l)}
.tbl-wrap{-webkit-overflow-scrolling:touch}
.stat-list li{color:var(--muted)}
.stat-list li strong{color:var(--heading)}
.check-row{color:var(--muted)}
.check-row .cr-name{color:var(--heading)}

/* ---- app shell (desktop base) ---- */
#app{min-height:100vh}
@supports (min-height:100dvh){#app{min-height:100dvh}}
nav.sidebar{background:#282828;height:100vh}
@supports (height:100dvh){nav.sidebar{height:100dvh}}
.side-nav a,.side-nav .nv-item{color:#D8D8D8}
.side-nav a:hover,.side-nav .nv-item:hover{background:rgba(255,255,255,.10);color:#fff}
.side-user{padding:10px 12px;border-top:1px solid rgba(255,255,255,.14);color:#D8D8D8;font-size:12px}
.side-user .su-name{color:#fff;font-weight:700;font-size:13px}
.side-user .su-role{color:#B9B9B9}
.side-signout{width:100%;margin-top:8px;background:rgba(255,255,255,.10);border:none;color:#fff;border-radius:8px;padding:9px;cursor:pointer;font-size:12.5px;font-weight:600;min-height:38px}
.side-signout:hover{background:var(--primary)}
header.app-header{-webkit-position:sticky;position:sticky;padding-top:env(safe-area-inset-top)}
.hdr-btn{display:none}
#nav-backdrop{display:none}
#bottomnav{display:none}
.mobile-only{display:none}

/* ---- auth screens ---- */
#auth-shell{display:none;min-height:100vh}
@supports (min-height:100dvh){#auth-shell{min-height:100dvh}}
#auth-shell.active{display:block}
#app.hidden,#portal-shell:not(.active){display:none}
.auth-wrap{max-width:440px;margin:0 auto;padding:24px 18px calc(28px + env(safe-area-inset-bottom))}
.auth-brandbar{background:#282828;color:#fff;padding:calc(22px + env(safe-area-inset-top)) 18px 22px;text-align:center}
.auth-brandbar .ab-logo{width:56px;height:56px;border-radius:16px;background:var(--primary);color:#fff;font-weight:800;font-size:26px;
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.auth-brandbar h1{color:#fff;font-size:22px;margin-bottom:2px}
.auth-brandbar p{color:#C9C9C9;font-size:12.5px;margin:0}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--sh-1);margin-top:-18px}
.auth-card h2{font-size:18px}
.auth-card .field input,.auth-card .field select{width:100%;min-height:44px;font-size:16px}
.auth-actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.auth-actions .btn{justify-content:center;min-height:46px;font-size:15px}
.auth-alt{text-align:center;font-size:13px;color:var(--muted);margin-top:14px}
.auth-alt button{background:none;border:none;color:var(--primary);font:inherit;font-weight:700;cursor:pointer;padding:4px}
.cred-hint{background:var(--primary-l);border:1px solid var(--primary-b);color:var(--primary-d);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.cred-hint code{font-family:var(--mono);font-weight:700}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-opt{border:1px solid var(--border);border-radius:12px;padding:10px;background:#fff;text-align:left;cursor:pointer;min-height:60px}
.role-opt .ro-t{font-weight:700;color:var(--heading);font-size:13px;display:block}
.role-opt .ro-s{color:var(--muted);font-size:11.5px}
.role-opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-l);box-shadow:0 0 0 1px var(--primary) inset}
.user-row{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #F0F0F1;flex-wrap:wrap}
.user-row:last-child{border-bottom:none}
.user-row .ur-main{min-width:0;flex:1}
.user-row .ur-name{font-weight:700;color:var(--heading);font-size:13.5px}
.user-row .ur-mail{color:var(--muted);font-size:12px;word-break:break-all}
.user-row .ur-act{display:flex;gap:6px;flex-wrap:wrap}

/* ---- mobile / tablet ---- */
@media (max-width:900px){
  body{font-size:15px}
  input,select,textarea{font-size:16px;min-height:42px}
  .btn{min-height:40px;padding:9px 14px}
  .btn-sm{min-height:34px}
  .btn-xs{min-height:30px;padding:4px 10px;font-size:12px}
  .iconbtn{width:42px;height:42px}
  #app{display:block;min-height:100vh}
  main#main{grid-area:auto;padding:14px 14px calc(var(--bottomnav-h) + 22px + env(safe-area-inset-bottom));max-width:none}
  header.app-header{height:calc(var(--header-h) + env(safe-area-inset-top));gap:8px;padding:0 10px;padding-top:env(safe-area-inset-top)}
  .wordmark .wm-sub{display:none}
  .wordmark .wm-name{font-size:16px}
  header.app-header .badge-demo{display:none}
  .hdr-btn{display:inline-flex}
  .search-wrap{position:fixed;top:calc(var(--header-h) + env(safe-area-inset-top));left:0;right:0;max-width:none;background:#fff;
    padding:10px 12px;border-bottom:1px solid var(--border);z-index:59;display:none;box-shadow:var(--sh-1)}
  .search-wrap.open{display:block}
  .search-wrap .s-ic{top:19px;left:21px}
  .search-wrap input{width:100%;min-height:42px}
  .search-results{top:56px;left:12px;right:12px}
  #role-switch{max-width:132px}
  nav.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;height:100%;z-index:210;
    transform:translateX(-100%);-webkit-transform:translateX(-100%);transition:transform .22s ease;padding-top:env(safe-area-inset-top)}
  nav.sidebar.open{transform:translateX(0);-webkit-transform:translateX(0)}
  #nav-backdrop{display:block;position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(40,40,40,.5);z-index:205;opacity:0;pointer-events:none;transition:opacity .2s}
  #nav-backdrop.open{opacity:1;pointer-events:auto}
  .side-nav a,.side-nav .nv-item{padding:12px;font-size:14.5px;min-height:44px}
  .side-nav .nv-txt,.side-nav .nv-count,.side-brand-txt{display:inline!important}
  .side-collapse{display:none}
  #bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;background:#fff;border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(40,40,40,.06)}
  #bottomnav a,#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    height:var(--bottomnav-h);border:none;background:none;color:var(--muted);font-size:10.5px;font-weight:600;text-decoration:none;cursor:pointer;position:relative}
  #bottomnav .bn-ic{font-size:18px;line-height:1}
  #bottomnav a[aria-current="page"],#bottomnav button[aria-current="page"]{color:var(--primary)}
  #bottomnav a[aria-current="page"]::before,#bottomnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;background:var(--primary);border-radius:0 0 3px 3px}
  #bottomnav .bn-dot{position:absolute;top:6px;right:26%;min-width:16px;height:16px;border-radius:999px;background:var(--primary);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .mobile-only{display:block}
  .page-head h1{font-size:19px}
  .page-actions{margin-left:0;width:100%}
  .page-actions .btn{flex:1;justify-content:center}
  .grid{gap:10px}
  .c-3,.c-4,.c-6,.c-8,.c-9,.c-12{grid-column:span 12}
  .two-col{grid-template-columns:1fr}
  .threepanel{grid-template-columns:1fr}
  .rack{grid-template-columns:repeat(4,1fr)}
  .board{grid-auto-columns:82vw}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{white-space:nowrap;padding:11px 12px}

  .subtabs::-webkit-scrollbar{display:none}
  .subtabs button{white-space:nowrap;min-height:36px}
  .stepper{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .stepper::-webkit-scrollbar{display:none}
  .step{min-width:96px;flex:none}
  .filters{gap:8px}
  .filters .field{flex:1 1 46%;min-width:0}
  .filters select,.filters input{width:100%;min-width:0}
  .overlay{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  .modal.wide{width:100%}
  .modal-b{padding:14px;-webkit-overflow-scrolling:touch}
  .modal-f{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  .modal-f .btn{flex:1;justify-content:center}
  .drawer{width:100%;max-width:none;border-radius:18px 18px 0 0;top:auto;height:88vh;padding-bottom:env(safe-area-inset-bottom)}
  #toasts{left:12px;right:12px;bottom:calc(var(--bottomnav-h) + 14px + env(safe-area-inset-bottom));max-width:none}
  .portal-wrap{padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
  .opp-meta{gap:10px}
  .opp-meta .m{flex:1 1 44%}
  .role-picker{grid-template-columns:1fr}
  .check-row .cr-name{min-width:0;flex:1 1 100%}
  .check-row .cr-actions{margin-left:0}
  .bar-h .bh-lbl{width:96px;font-size:11px}
}

/* ---- stacked table cards on small screens ---- */
@media (max-width:700px){
  .tbl-wrap{border:none;background:transparent;overflow:visible}
  table.tbl{min-width:0;width:100%;display:block;font-size:13.5px}
  table.tbl thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  table.tbl tbody{display:block}
  table.tbl tr{display:block;background:#fff;border:1px solid var(--border);border-radius:12px;padding:6px 10px;margin-bottom:10px;box-shadow:var(--sh-1)}
  table.tbl td{display:flex;gap:10px;align-items:flex-start;padding:7px 0;height:auto;border-bottom:1px solid #F2F2F3;text-align:left}
  table.tbl tr td:last-child{border-bottom:none}
  table.tbl td::before{content:attr(data-l);flex:none;width:38%;max-width:140px;color:var(--muted);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
  table.tbl td[data-l=""]::before,table.tbl td[colspan]::before{display:none}
  table.tbl td[colspan]{display:block}
  table.tbl tr.rowlink{cursor:pointer;-webkit-tap-highlight-color:rgba(237,63,47,.08)}
  table.tbl tr.rowlink:active{border-color:var(--primary)}
}

.rack{background:#2B2B2B}
.slot{background:#3A3A3A;border-color:#5A5A5A;color:#C6C6C6}
.email-view{background:#FCFBF7;border-color:#E6E2D6}
.board-col{background:#F1F1F2}
.skel{background:linear-gradient(90deg,#EFEFF1 25%,#F8F8F9 50%,#EFEFF1 75%);background-size:200% 100%}
.toast{background:#282828}
.overlay{background:rgba(40,40,40,.45)}
.drawer-overlay{background:rgba(40,40,40,.35)}
.warnbox{color:#7A4B00}
.tbl th{border-bottom-color:var(--border)}


/* ---- v3 charts ---- */
.chart{margin-top:4px}
.chart svg{display:block;max-width:100%;overflow:visible}
.chart svg text,.chart svg *{user-select:none;-webkit-user-select:none;-moz-user-select:none}
::selection{background:rgba(237,63,47,.28);color:#282828}
::-moz-selection{background:rgba(237,63,47,.28);color:#282828}
.chart-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.chart-legend-v{flex-direction:column;gap:6px;margin-top:0}
.chart-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-2px}
.chart-legend i.lg-dash{background:none;border-top:2px dashed var(--heading);height:0;border-radius:0;width:16px;vertical-align:4px;opacity:.7}
.chart-legend span{display:inline-flex;align-items:center}
.mbar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12.5px}
.mbar[role="button"]{cursor:pointer}
.mb-lbl{width:112px;flex:none;color:var(--muted);font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-track{flex:1;background:#F0F0F2;border-radius:999px;height:12px;overflow:hidden;min-width:40px}
.mb-fill{display:block;height:100%;border-radius:999px}
.mb-val{flex:none;min-width:44px;text-align:right;font-weight:800;color:var(--heading);font-size:12.5px}
.qcards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qcard{border:1px solid var(--border);border-radius:12px;padding:10px;background:#fff}
.qcard.cur{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.qcard .q-t{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.qcard .q-a{font-size:16px;font-weight:800;color:var(--heading);margin-top:2px}
.qcard .q-s{font-size:11px;color:var(--muted)}
.qcard .q-bar{height:6px;border-radius:999px;background:#F0F0F2;margin-top:7px;overflow:hidden}
.qcard .q-bar i{display:block;height:100%;border-radius:999px}
.stagechips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stagechips button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;min-height:34px}
.stagechips button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
@media (max-width:700px){ .qcards{grid-template-columns:repeat(2,1fr)} .mb-lbl{width:82px;font-size:11.5px}
  .stagechips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .stagechips::-webkit-scrollbar{display:none} .stagechips button{white-space:nowrap} }


/* ---- v4 view switch, cards, compact list ---- */
.viewswitch{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff}
.viewswitch button{border:none;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);
  padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:38px;border-right:1px solid var(--border)}
.viewswitch button:last-child{border-right:none}
.viewswitch button:hover{background:#F4F4F5;color:var(--heading)}
.viewswitch button[aria-pressed="true"]{background:var(--primary);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.ecard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:var(--sh-1);cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:border-color .12s,box-shadow .12s}
.ecard:hover{border-color:var(--primary);box-shadow:var(--sh-2)}
.ecard .ec-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ecard .ec-id{font-weight:800;font-size:12.5px;color:var(--heading)}
.ecard .ec-h>*:last-child{margin-left:auto}
.ecard .ec-t{margin:0;font-size:14.5px;color:var(--heading);line-height:1.3}
.ecard .ec-s{margin:0;font-size:12.5px;color:var(--muted)}
.ecard .ec-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:2px}
.ecard .ec-meta span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;display:flex;flex-direction:column}
.ecard .ec-meta b{font-size:13px;color:var(--heading);text-transform:none;letter-spacing:0;font-weight:700}
.ecard .ec-prog{height:5px;background:#F0F0F2;border-radius:999px;overflow:hidden;margin-top:4px}
.ecard .ec-prog i{display:block;height:100%;background:var(--primary);border-radius:999px}
.ecard .ec-stage{margin:2px 0 0}
.ecard .ec-next{margin:0;font-size:12px;color:var(--muted)}
.clist{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.crow{display:flex;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid #F1F1F2;cursor:pointer;font-size:13px}
.crow:last-child{border-bottom:none}
.crow:hover{background:var(--primary-l)}
.crow .cr-id{flex:none;font-weight:800;color:var(--heading);font-size:12px;width:96px}
.crow .cr-main{flex:1;min-width:0;color:var(--muted)}
.crow .cr-main strong{color:var(--heading)}
.crow .cr-val{flex:none;text-align:right;font-weight:700;color:var(--heading);font-size:12.5px}
@media (max-width:700px){
  .cards{grid-template-columns:1fr}
  .viewswitch .vs-t{display:none}
  .viewswitch button{padding:8px 14px;font-size:15px}
  .crow .cr-id{width:76px}
}

a[data-action="nav"],a[role="link"]{cursor:pointer;color:var(--primary);text-decoration:underline}
a[data-action="nav"]:hover{color:var(--primary-d)}

/* ---- AI badge / Phase 2 badge : distinct, consistent colour language ---- */
.badge-phase2{display:inline-flex;align-items:center;gap:4px;background:#F1ECFF;border:1px solid #D6C6FF;color:#5B32C4;
  font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase}

.aimap-row{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.aimap-row h4{margin:0 0 4px;font-size:14px;color:var(--heading);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aimap-row p{margin:0;font-size:12.5px;color:var(--muted)}
.aimap-row .am-link{margin-top:6px}
.aimap-group{margin-bottom:18px}
.aimap-group>h3{display:flex;align-items:center;gap:10px}
.phase2-panel{border:1px dashed #D6C6FF;background:#FBFAFF;border-radius:12px;padding:12px 14px;margin-top:10px}

/* ----- KYC clearance approval gate (AH) -----
   ModAE approval matrix routes "KYC clearance" to AH. This surfaces it as a real
   approval so AH's inbox is consistent with every other AH responsibility. The gate
   is DERIVED from document state, so the inbox and the customer record cannot disagree:
     - raised once at least one document has moved off "Missing" (upload has begun);
     - "Awaiting documents" (not yet AH's action) while any document is still
       Missing / Expired / Rejected;
     - "Pending" (AH's action) once every document is present. AH verifies each
       document, then approves. Approve is enabled only when all are Verified;
     - "Approved" once AH records the clearance.
   Non-Blue classes never raise this gate. */
var KYC_OPEN_STATES=["Missing","Expired","Rejected"];
function kycDocSummary(cid){ var items=(S.kyc&&S.kyc[cid])||[];
  var total=items.length;
  var verified=items.filter(function(k){return k.state==="Verified";}).length;
  var notClean=items.filter(function(k){return KYC_OPEN_STATES.indexOf(k.state)>=0;}).length;
  var started=items.some(function(k){return k.state!=="Missing";});
  var missingNames=items.filter(function(k){return KYC_OPEN_STATES.indexOf(k.state)>=0;}).map(function(k){return k.name;});
  return {total:total,verified:verified,notClean:notClean,started:started,
    allVerified:(total>0&&verified===total),missingNames:missingNames}; }
function reconcileKyc(){
  if(!S||!S.approvals||!S.customers) return;
  S.customers.forEach(function(c){
    var id="AP-KYC-"+c.id;
    var a=S.approvals.find(function(x){return x.id===id;});
    if(c.cls!=="Blue"){ if(a&&a.status!=="Approved") S.approvals=S.approvals.filter(function(x){return x.id!==id;}); return; }
    var sm=kycDocSummary(c.id);
    var shouldExist=sm.started&&!sm.allVerified; /* upload has begun and not yet fully cleared */
    if(!a){ if(!shouldExist) return;
      var o=S.opps.find(function(x){return x.customerId===c.id;});
      a={id:id,kind:"KYC clearance",subject:c.name+" — verify KYC documents and clear",
         custId:c.id,oppId:o?o.id:null,leadId:o?o.leadId:null,
         needed:["AH"],decisions:{},created:new Date(DEMO_TODAY).toISOString(),
         context:"Blue-class (new / unverified) customer. AH verifies each KYC document. Clearance is recorded automatically once every document is verified. The gate only becomes an AH action once all documents are present.",
         evidence:["Customer KYC checklist","Customer classification history"],kyc:true,status:"Awaiting documents"};
      S.approvals.unshift(a); }
    if(sm.allVerified){ /* auto-resolve on final verification — no separate approve click */
      if(a.status!=="Approved"){ a.status="Approved";
        if(!a.decisions.AH) a.decisions.AH={d:"Approve",c:"KYC cleared on final document verification (AH)",when:new Date(DEMO_TODAY).toISOString(),auto:true}; }
      return; }
    if(a.status==="Approved") delete a.decisions.AH; /* a document regressed — reopen */
    a.status=(sm.notClean>0?"Awaiting documents":"Pending"); /* raise / reopen / refresh */
  });
}

/* ----- workbench calculations ----- */
function sparesTotals(oppId){ const lines=S.sparesLines.filter(l=>l.oppId===oppId);
  const sell=lines.reduce((a,l)=>a+(l.sell||0)*l.qty,0); const cost=lines.reduce((a,l)=>a+(l.cost||0)*l.qty,0);
  return {sell,cost,gm:sell-cost,gmPct:sell?((sell-cost)/sell*100):0}; }
function svcCalc(sv){ const rs=S.rateSheets[sv.mode]; const cur=rs.cur;
  const heads=sv.engineers.reduce((a,e)=>a+e.count,0);
  const prof=sv.engineers.reduce((a,e)=>a+e.count*rs.dayRate[e.cat]*Math.max(sv.workDays,0),0);
  const minTop=Math.max(0,(rs.minCallout-sv.workDays))*heads*(rs.dayRate.Engineer);
  const travel=heads*sv.travelDays*rs.travelDay;
  const ot=heads*sv.otHours*rs.otHour;
  const weekend=sv.weekendDays*heads*(rs.dayRate.Senior*rs.weekendPct/100);
  const standby=sv.standbyDays*heads*rs.standbyDay;
  const flights=heads*2*rs.flight; const visa=heads*rs.visa;
  const nights=(sv.workDays+sv.travelDays+sv.standbyDays); const hotel=heads*nights*rs.hotelNight;
  const transport=(sv.workDays+sv.travelDays)*rs.transportDay*heads;
  const perDiem=heads*nights*rs.perDiem; const tools=rs.tools;
  const sub=prof+minTop+travel+ot+weekend+standby+flights+visa+hotel+transport+perDiem+tools;
  const tax=Math.round(sub*(sv.mode==="India"?0.18:0));
  return {cur,heads,rows:[["Professional days",prof],["Minimum call-out top-up",minTop],["Travel days",travel],["Overtime",ot],
    ["Weekend premium",weekend],["Standby",standby],["Flights (return)",flights],["Visa",visa],["Hotel",hotel],
    ["Local transport",transport],["Per diem",perDiem],["Tools & consumables",tools]],sub,tax,total:sub+tax}; }
function projTotals(oppId){ const lines=S.boq.filter(b=>b.oppId===oppId);
  const priced=lines.filter(b=>b.sell!=null);
  const sell=priced.reduce((a,b)=>a+b.sell*b.qty,0); const cost=priced.reduce((a,b)=>a+(b.cost||0)*b.qty,0);
  return {sell,cost,gm:sell-cost,gmPct:sell?((sell-cost)/sell*100):0,unpriced:lines.length-priced.length}; }
function oppValue(o){ if(o.route==="Spares") return sparesTotals(o.id).sell;
  if(o.route==="Reactive Service"){ const sv=S.svcEstimates.find(s=>s.oppId===o.id); return sv?svcCalc(sv).total:0; }
  return projTotals(o.id).sell; }
function rackWarning(){ const r=S.rack; const rly=r.slots.filter(s=>s.mod==="RLY").map(s=>s.i);
  if(!rly.length) return null; const contiguous=rly.every((v,i,a)=>i===0||v===a[i-1]+1);
  const filled=r.slots.filter(s=>s.mod).length;
  if(!contiguous) return "Relay modules are not contiguous — rearrange RLY into adjacent slots.";
  if(filled>=r.capacity) return "No spare slot left — free at least one slot for expansion.";
  return null; }

/* ----- readiness ----- */
function conditionsFor(o){
  const list=[];
  S.approvals.forEach(a=>{
    if(a.status==="Pending") return;
    const relevant=a.oppId===o.id||(a.leadId&&o.leadId&&a.leadId===o.leadId);
    if(!relevant) return;
    Object.entries(a.decisions).forEach(([role,dd])=>{
      if(dd.d==="Approve with conditions") list.push({approvalId:a.id,kind:a.kind,role,condition:dd.c,ack:dd.ack||null});
    });
  });
  return list;
}
function pendingConditions(o){ return conditionsFor(o).filter(x=>!x.ack); }
function readiness(o){ const blockers=[];
  const c=cust(o.customerId);
  if(o.route==="Spares"){ S.sparesLines.filter(l=>l.oppId===o.id).forEach(l=>{
      if(l.state!=="confirmed") blockers.push({t:`Line ${l.custRef}: low-confidence match unresolved`,fix:"Resolve in Spares workbench"});
      if(l.priceList&&l.priceList.expired) blockers.push({t:`Line ${l.custRef}: expired price source (${l.priceList.version})`,fix:"Request price update in workbench"}); }); }
  if(o.route==="Reactive Service"){ const sv=S.svcEstimates.find(s=>s.oppId===o.id);
    if(sv){ sv.engineers.forEach(e=>{ if(e.available===false) blockers.push({t:`Engineer ${e.name} unavailable (${e.availNote})`,fix:"Resolve availability in Service workbench"}); });
      if(!sv.manualTravelConfirmed) blockers.push({t:"Travel estimate not confirmed",fix:"Confirm manual travel estimate"});
      if(sv.mode==="International"&&/unclear/i.test(sv.visa)) blockers.push({t:"Visa/travel assumptions incomplete",fix:"Clarify with customer"}); } }
  if(o.route==="Project"){ if(S.signals.some(s=>s.oppId===o.id&&s.state==="Gap")) blockers.push({t:"Signal gap: unassigned tag(s)",fix:"Resolve in Signal List tab"});
    if(rackWarning()) blockers.push({t:"Rack layout warning",fix:"Rearrange modules in Rack Layout tab"});
    S.boq.filter(b=>b.oppId===o.id).forEach(b=>{ if(b.sell==null) blockers.push({t:`${b.item}: unpriced line`,fix:"Request price update"});
      if(b.priceSrc&&b.priceSrc.expired) blockers.push({t:`${b.item}: expired price source`,fix:"Resolve expired price"});
      if(b.compliance==="Partially Comply"&&b.status!=="accepted") blockers.push({t:`${b.item}: partial compliance / deviation open`,fix:"Resolve deviation (Technical + LJS)"}); }); }
  if(c&&c.cls==="Blue"){ const kitems=S.kyc[c.id]||[];
    const kycCleared=kitems.length>0&&kitems.every(k=>k.state==="Verified");
    if(!kycCleared&&!o.kycOverride) blockers.push({t:"KYC not cleared for Blue customer (AH clearance pending)",fix:"Clear KYC in Approvals, or override with a logged reason",kyc:true}); }
  if(c&&c.cls==="Amber"&&o.amberFee&&o.amberFee.status!=="Confirmed") blockers.push({t:"Amber processing fee pending",fix:"Confirm fee via Customer Portal simulation"});
  const amberAp=S.approvals.find(a=>a.oppId===o.id&&a.status==="Pending"&&/continuation/i.test(a.kind));
  if(amberAp) blockers.push({t:`${amberAp.kind} approval pending`,fix:"Complete in Approvals"});
  pendingConditions(o).forEach(pc=>blockers.push({t:`Condition from ${pc.kind} (${pc.role}) not yet confirmed incorporated`,fix:"Confirm in Proposal → Conditions from approvals"}));
  return blockers; }

function commercialGate(o){ // returns route based on demo thresholds; numbers only for LJS/AH
  let gm,disc=0;
  if(o.route==="Spares"){ gm=sparesTotals(o.id).gmPct; }
  else if(o.route==="Project"){ gm=projTotals(o.id).gmPct; }
  else { const sv=S.svcEstimates.find(s=>s.oppId===o.id); if(sv){ const c=svcCalc(sv); gm=28; } }
  const t=S.config.approvalThresholds;
  if(gm==null||isNaN(gm)) return {gate:"LJS + AH",gm,disc,why:"Margin not computable"};
  if(gm>=t.gmAuto&&disc<=t.discAuto) return {gate:"LJS final release",gm,disc,why:`GM ≥ ${t.gmAuto}% and discount ≤ ${t.discAuto}%`};
  if(gm>=t.gmLjs&&disc<=t.discLjs) return {gate:"LJS approval",gm,disc,why:`GM ${t.gmLjs}–${t.gmAuto-0.01}% or discount ${t.discAuto+0.01}–${t.discLjs}%`};
  return {gate:"LJS + AH",gm,disc,why:`GM < ${t.gmLjs}% or discount > ${t.discLjs}%`}; }

/* AI-suggested commercial terms — rule-based on customer class + route (demo) */
function recommendTerms(o){
  const c=cust(o.customerId); const terms=[];
  if(c.cls==="Green") terms.push("Payment: 30 days from invoice (standard Green-customer terms).");
  else if(c.cls==="Blue") terms.push("Payment: 50% advance, balance on delivery (Blue-customer default).");
  else if(c.cls==="Amber") terms.push("Payment: 100% advance before dispatch (Amber gate condition).");
  else terms.push("Payment: 100% advance, prepayment only — Red-class continuation condition.");
  terms.push(o.route==="Spares"?"Delivery: ex-works, 4–6 weeks from PO, per part lead time.":
    o.route==="Reactive Service"?"Delivery: engineer mobilisation within 5 working days of PO.":
    "Delivery: per project milestone schedule, confirmed at kickoff.");
  terms.push("Validity: "+o.validityDays+" days from proposal date.");
  if(c.currency&&c.currency!=="INR") terms.push("Pricing in "+c.currency+"; exchange rate fixed at proposal date.");
  terms.push("Warranty: standard OEM warranty terms apply, pass-through only.");
  return terms;
}

let lastFocused=null;
function openModal({title,body,footer,wide,onClose}){
  lastFocused=document.activeElement;
  const root=document.getElementById("modal-root");
  root.innerHTML=`<div class="overlay" data-overlay="1">
    <div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-h"><h2>${esc(title)}</h2><span class="badge-demo" style="margin-left:auto">Demo</span>
        <button class="iconbtn" data-action="close-modal" aria-label="Close dialog">✕</button></div>
      <div class="modal-b">${body}</div>
      ${footer?`<div class="modal-f">${footer}</div>`:""}
    </div></div>`;
  root._onClose=onClose||null;
  deLinkAll();
  const dlg=root.querySelector(".modal");
  const f=dlg.querySelectorAll("button,[href],input,select,textarea");
  if(f.length) f[0].focus();
  dlg.addEventListener("keydown",e=>{
    if(e.key==="Tab"){ const items=Array.from(dlg.querySelectorAll("button,[href],input,select,textarea")).filter(x=>!x.disabled);
      if(!items.length) return; const first=items[0],last=items[items.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();} }});
}
function closeModal(){ const root=document.getElementById("modal-root"); if(root._onClose) root._onClose();
  root._onClose=null; root.innerHTML=""; if(lastFocused&&lastFocused.focus) lastFocused.focus(); }
function confirmDlg(title,msg,okLabel,onOk,needReason){
  openModal({title,body:`<p>${esc(msg)}</p>${needReason?`<div class="field"><label for="cf-reason">Reason (required)</label><textarea id="cf-reason" rows="2" style="width:100%"></textarea><div class="err" id="cf-err" hidden>A reason is required.</div></div>`:""}`,
    footer:`<button class="btn" data-action="close-modal">Cancel</button><button class="btn btn-danger" id="cf-ok">${esc(okLabel)}</button>`});
  document.getElementById("cf-ok").addEventListener("click",()=>{
    let reason=""; if(needReason){ reason=document.getElementById("cf-reason").value.trim();
      if(!reason){ document.getElementById("cf-err").hidden=false; return; } }
    closeModal(); onOk(reason); });
}

/* Routing is held in memory. The address bar is never touched, so the file works
   offline, opens from disk and never asks the browser to navigate anywhere. */
let ROUTE="/launcher";
const ROUTE_HISTORY=[];
function normRoute(h){ h=String(h||""); if(h.charAt(0)==="#") h=h.slice(1);
  if(h.charAt(0)!=="/") h="/"+h; return h; }
function go(hash){
  closeNav(); closeSearchBar();
  const next=normRoute(hash);
  if(next!==ROUTE){ ROUTE_HISTORY.push(ROUTE); if(ROUTE_HISTORY.length>60) ROUTE_HISTORY.shift(); ROUTE=next; }
  render();
  const m=document.getElementById("main"); if(m) m.scrollTop=0;
  try{ window.scrollTo(0,0); }catch(e){}
}
function goBack(){ if(ROUTE_HISTORY.length){ ROUTE=ROUTE_HISTORY.pop(); render(); } else go("/home"); }
function route(){ const parts=ROUTE.replace(/^\//,"").split("/");
  return {page:parts[0]||"",a:parts[1]||"",b:parts[2]||""}; }

  const csvBtn=`<button class="btn" data-action="export-pipeline">⬇ Export CSV</button>`;
  const modeBtn=viewSwitch("pipeline",[["table","Table"],["card","Cards"],["board","Board"],["compact","Compact"]]);
  const filters=`<div class="filters">
    <div class="field"><label>Owner</label><select data-action="pipe-f" data-k="owner"><option value="">All</option>${["RS","PP","LJS","AH"].map(o=>`<option ${pipeState.owner===o?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Customer class</label><select data-action="pipe-f" data-k="cls"><option value="">All</option>${Object.keys(CLASS_META).map(o=>`<option ${pipeState.cls===o?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Route</label><select data-action="pipe-f" data-k="route"><option value="">All</option>${ROUTES.map(o=>`<option ${pipeState.route===o?"selected":""}>${o}</option>`).join("")}</select></div>
    <div class="field"><label>Milestone</label><select data-action="pipe-f" data-k="milestone"><option value="">All</option>${MILESTONES.map(o=>`<option ${pipeState.milestone===o?"selected":""}>${o}</option>`).join("")}</select></div>
  </div>`;
  let body;
  const vm=viewMode("pipeline");
  if(vm==="card"){ body=oppCards(rows,comm); }
  else if(vm==="compact"){ body=oppCompact(rows,comm); }
  else if(vm==="board"){
    const cols=["Customer/KYC","Sourcing","Proposal","Approval","Submitted"];
    body=`<div class="board">${cols.map(mcol=>`<div class="board-col"><h4>${mcol}</h4>
      ${rows.filter(o=>o.milestone===mcol).map(o=>`<div class="bcard" data-action="nav" data-to="#/opp/${o.id}/overview" tabindex="0" role="button">
        <strong class="mono">${o.dispId}</strong> ${healthChip(o.health)}<br>${esc(cust(o.customerId).name)}<br>
        <span class="hint">${esc(o.nextAction)}</span></div>`).join("")||'<p class="hint" style="padding:6px">Empty</p>'}</div>`).join("")}</div>`;
  } else {
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>ID</th><th>Customer</th><th>Opportunity</th><th>Class</th><th>Route</th><th>Context</th><th>Type</th><th>Area</th><th>Owner</th>
      <th title="AI-suggested win probability">🤖 Prob.</th><th>Value</th>${comm?"<th>COGS</th><th>GM</th><th>GM%</th><th>Disc.</th>":""}
      <th>Health</th><th>Milestone</th><th>Next action</th><th>Due</th><th>Updated</th></tr></thead><tbody>
      ${rows.map(o=>{ const c=cust(o.customerId); const v=oppValue(o);
        const tt=o.route==="Spares"?sparesTotals(o.id):o.route==="Project"?projTotals(o.id):null;
        return `<tr class="rowlink" data-action="nav" data-to="#/opp/${o.id}/overview" tabindex="0">
        <td class="mono"><strong>${o.dispId}</strong></td><td>${esc(c.name)}</td><td>${esc(o.name)}</td>
        <td>${classChip(c.cls)}</td><td>${esc(o.route)}</td><td>${esc(o.context)}</td><td>${esc(o.type)}</td><td>${esc(o.area)}</td>
        <td>${esc(o.owner)}</td><td>${o.probability}%</td><td>${money(v,o.valueCur)}</td>
        ${comm?`<td>${tt?money(tt.cost,o.valueCur):"—"}</td><td>${tt?money(tt.gm,o.valueCur):"—"}</td><td>${tt?pct(tt.gmPct):"—"}</td><td>0%</td>`:""}
        <td>${healthChip(o.health)}${!o.closed&&ageDays(o.due)>0?` ${badgeAI("stale")}`:""}</td><td><span class="chip chip-navy"><span class="dot"></span>${esc(o.milestone)}</span></td>
        <td>${esc(o.nextAction)}</td><td>${fmtD(o.due)}</td><td>${fmtD(o.created)}</td></tr>`; }).join("")}
    </tbody></table></div>
    ${comm?"":'<p class="hint" style="margin-top:6px">🔒 COGS, GM, GM% and discount columns are visible only to LJS and AH.</p>'}`;
  }
  return pageHead("Opportunities","Pipeline across all routes and milestones",csvBtn+modeBtn)+filters+body; }

/* ============================================================
   VIEW: Opportunity shell + tabs
   ============================================================ */
const OPP_TABS=[["overview","Overview"],["requirement","Requirement"],["customer","Customer/KYC"],["clarifications","Clarifications"],
  ["sourcing","Sourcing"],["proposal","Proposal"],["approvals","Approvals"],["comms","Communications"],["po","PO & Handover"],["files","Files"],["oaudit","Audit"]];
function vOpp(id,tab){
  const o=opp(id); if(!o) return "<p>Opportunity not found.</p>";
  const c=cust(o.customerId); const comm=canViewCommercial(S.role);
  const v=oppValue(o);
  const head=`<div class="opp-head">
    <div class="opp-head-top">
      <span class="opp-id">${o.dispId}</span><h1 style="margin:0">${esc(o.name)}</h1>
      ${classChip(c.cls)}<span class="chip chip-navy"><span class="dot"></span>${esc(o.route)}</span>
      <span class="chip chip-grey"><span class="dot"></span>${esc(o.context)}</span>
      ${healthChip(o.health)}${o.phase?`<span class="badge-phase">${esc(o.phase)}</span>`:""}
      ${tab==="po"?badgePhase2("Phase 2 — PO & handover"):""}
    </div>
    <div class="opp-meta">
      <span class="m"><span class="k">Owner</span><span>${esc(o.owner)} — ${esc(ROLES[o.owner].name)}</span></span>
      <span class="m"><span class="k">Milestone</span><span>${esc(o.milestone)}</span></span>
      <span class="m"><span class="k">Customer value</span><span>${S.role==="CUST"?'<span class="restricted">🔒 Restricted</span>':money(v,o.valueCur)}</span></span>
      <span class="m"><span class="k">Next action</span><span>${esc(o.nextAction)}</span></span>
      <span class="m"><span class="k">Due</span><span>${fmtD(o.due)}</span></span>
      ${o.closed?`<span class="m"><span class="k">Outcome</span><span>${statusChip(o.closed)}</span></span>`:""}
    </div></div>`;
  const tabs=`<div class="tabs" role="tablist">${OPP_TABS.map(([k,lbl])=>{
    const unavailable=(k==="po"&&!o.submittedOn&&o.id!=="OP-1");
    return `<button role="tab" aria-selected="${tab===k}" data-action="opp-tab" data-opp="${id}" data-tab="${k}"
      ${unavailable?`title="Available after submission (Phase 2 direction)"`:""}>${lbl}${k==="po"&&unavailable?" 🔒":""}</button>`; }).join("")}</div>`;
  let body="";
  switch(tab){
    case "overview": body=oppOverview(o); break;
    case "requirement": body=oppRequirement(o); break;
    case "customer": body=oppCustomer(o); break;
    case "clarifications": body=oppClar(o); break;
    case "sourcing": body=oppSourcing(o); break;
    case "proposal": body=oppProposal(o); break;
    case "approvals": body=oppApprovals(o); break;
    case "comms": body=oppComms(o); break;
    case "po": body=oppPO(o); break;
    case "files": body=oppFiles(o); break;
    case "oaudit": body=oppAudit(o); break;
    default: body=oppOverview(o);
  }
  return head+tabs+body; }

    <div class="card c-4"><h3>Pending approvals</h3><ul class="stat-list">${S.approvals.filter(a=>a.oppId===o.id&&a.status==="Pending").map(a=>`<li><a href="#/approval/${a.id}">${esc(a.kind)}</a>${statusChip("Pending")}</li>`).join("")||"<li>None pending.</li>"}</ul></div>

      <button class="btn btn-sm" data-action="opp-tab" data-opp="${o.id}" data-tab="oaudit">Full audit</button></div>

      <h4 style="margin-top:10px">Revisions</h4>

function previewDoc(o,excerpt){ const c=cust(o.customerId); const v=oppValue(o);

function oppPO(o){
  if(o.id!=="OP-1") return `<div class="card">${badgePhase2("Phase 2 — PO & handover")}
    <p style="margin-top:8px">PO validation and handover open after a customer PO is received. In this demo, Scenario 1 (2606307RS) carries a seeded PO comparison.</p>

  const pc=S.poCompare; const h=S.handover;
  const allLinesOk=pc.lines.every(l=>l.state==="Match"||l.state==="Informational difference"||l._resolved);
  const bothAccepted=pc.acceptance.LJS&&pc.acceptance.AH;
  const hoTotal=h.groups.reduce((a,g)=>a+g.items.length,0), hoDone=h.groups.reduce((a,g)=>a+g.items.filter(i=>i.done).length,0);
  return badgePhase2("Phase 2 — PO & handover")+
  `<div class="grid g-12" style="margin-top:8px">

        <td style="white-space:nowrap">${(ln.state==="Review required"||ln.state==="Blocking deviation")&&!ln._resolved?`
          <button class="btn btn-xs" data-action="po-clarify" data-i="${i}">Clarify</button>
          <button class="btn btn-xs" data-action="po-amend" data-i="${i}">Request amendment</button>
          <button class="btn btn-xs" data-action="po-approve-dev" data-i="${i}" ${isApprover(S.role)?"":`disabled title="LJS/AH only"`}>Approve deviation</button>`:""}</td></tr>`).join("")}
      </tbody></table></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btn-sm ${pc.acceptance.LJS?"":"btn-primary"}" data-action="po-accept" data-r="LJS" ${S.role==="LJS"&&allLinesOk&&!pc.acceptance.LJS?"":`disabled title="${!allLinesOk?"Resolve review/blocking items first":S.role!=="LJS"?"Switch persona to LJS":"Already accepted"}"`}>LJS accept ${pc.acceptance.LJS?"✓":""}</button>
        <button class="btn btn-sm ${pc.acceptance.AH?"":"btn-primary"}" data-action="po-accept" data-r="AH" ${S.role==="AH"&&allLinesOk&&!pc.acceptance.AH?"":`disabled title="${!allLinesOk?"Resolve review/blocking items first":S.role!=="AH"?"Switch persona to AH":"Already accepted"}"`}>AH accept ${pc.acceptance.AH?"✓":""}</button>
        <button class="btn btn-sm btn-danger" data-action="po-reject" ${bothAccepted?"disabled":""}>Reject PO</button>
      </div>
      ${bothAccepted?'<div class="okbox" style="margin-top:8px">PO jointly accepted by LJS + AH — proceed to handover below.</div>':'<p class="hint" style="margin-top:6px">Joint acceptance needs LJS and AH — use the role switcher to complete both.</p>'}`}
    </div>

        }
        return "";
      })()}
      ${h.groups.map((g,gi)=>`<h4 style="margin-top:10px">${esc(g.g)}</h4>${g.items.map((it,ii)=>`

function render(){
  if(!S) load();
  ensureAuth();
  const authShell=document.getElementById("auth-shell");
  if(!S.auth.user){ document.body.classList.add("chrome-off"); renderAuth(); return; }
  if(authShell) authShell.classList.remove("active");
  const r=route();
  const portalMode=(r.page==="portal")||S.role==="CUST";
  document.getElementById("app").classList.toggle("hidden",portalMode);
  document.getElementById("portal-shell").classList.toggle("active",portalMode);
  document.body.classList.toggle("chrome-off",portalMode);
  if(portalMode){ renderPortal(); deLink(document.getElementById("portal-shell")); closeNav(); return; }
  renderChrome();
  const main=document.getElementById("main");
  let html="";
  switch(r.page){
    case "": case "launcher": html=S.started?vLauncher():vLauncher(); break;
    case "home": html=vDashboard(); break;
    case "users": html=vUsers(); break;
    case "po": html=vPurchaseOrders(); break;
    case "aimap": html=vAIMap(); break;
    case "inbox": html=vInbox(); break;
    case "lead": html=vLead(r.a); break;
    case "register": html=vRegister(r.a); break;
    case "pipeline": html=vPipeline(); break;
    case "proposals": html=vProposals(); break;
    case "opp": html=vOpp(r.a,r.b||"overview"); break;
    case "approvals": html=vApprovals(); break;
    case "approval": html=vApprovalDetail(r.a); break;
    case "customers": html=vCustomers(); break;
    case "customer": html=vCustomer(r.a); break;
    case "analytics": html=vAnalytics(); break;
    case "audit": html=vAudit(); break;
    case "admin": html=vAdmin(); break;
    default: html=vLauncher();
  }
  if(!allowed(r.page)){
    html=pageHead("No access","Your role does not include this area")+
      `<div class="card"><h3>Restricted</h3><p>You are signed in as <strong>${esc(roleLabel(S.role))}</strong>. This section is not part of that role.</p>

      <button class="btn btn-primary" data-action="nav" data-to="${homeRoute(S.role)}">Go to my dashboard</button></div>`;
  }
  main.innerHTML=html;
  enhanceTables(main);
  deLinkAll();
}

function downloadBlob(name,mime,content){
  const b=new Blob([content],{type:mime}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},200); }
function csvRow(arr){ return arr.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")+"\n"; }
function exportPipeline(){ let out=csvRow(["DEMO - NOT A COMMERCIAL OFFER - fictional data"]);
  const comm=canViewCommercial(S.role);
  out+=csvRow(["ID","Customer","Opportunity","Class","Route","Context","Type","Area","Owner","Probability","Value","Currency","Milestone","Health","Next action","Due"].concat(comm?["COGS","GM","GM%"]:[]));
  S.opps.forEach(o=>{ const c=cust(o.customerId); const t=o.route==="Spares"?sparesTotals(o.id):o.route==="Project"?projTotals(o.id):null;
    out+=csvRow([o.dispId,c.name,o.name,c.cls,o.route,o.context,o.type,o.area,o.owner,o.probability+"%",oppValue(o),o.valueCur,o.milestone,o.health,o.nextAction,fmtD(o.due)].concat(comm?[t?t.cost:"",t?t.gm:"",t?Math.round(t.gmPct)+"%":""]:[])); });
  downloadBlob("wintrack-pipeline-demo.csv","text/csv",out); audit("PIPELINE","Pipeline exported (CSV)","—","file","User export","Analytics"); save(); toast("Pipeline CSV downloaded (demo disclaimer included)"); }
function exportAudit(kind){
  if(kind==="json"){ downloadBlob("wintrack-audit-demo.json","application/json",JSON.stringify({disclaimer:"DEMO - NOT A COMMERCIAL OFFER - fictional data",events:S.audit},null,2)); }
  else { let out=csvRow(["DEMO - fictional data"]);
    out+=csvRow(["Timestamp","Actor","Role","Object","Action","Old","New","Reason","Source","Correlation","External"]);
    S.audit.forEach(e=>out+=csvRow([e.when,e.actor,e.role,e.obj,e.action,e.oldV,e.newV,e.reason,e.src,e.corr,e.ext]));
    downloadBlob("wintrack-audit-demo.csv","text/csv",out); }
  toast("Audit export downloaded"); }

  "ap-revoke":(el)=>{ const a=S.approvals.find(x=>x.id===el.dataset.id);
    const targetRole=el.dataset.role||S.role;
    const isSelf=targetRole===S.role;
    const isOverride=!isSelf&&S.role==="LJS";
    if(!isSelf&&!isOverride){ toast("You can only revoke your own decision on this gate","warn"); return; }
    if(!a.decisions[targetRole]){ toast(targetRole+" has not recorded a decision on this gate","warn"); return; }
    const prevDecision=a.decisions[targetRole].d; const prevStatus=a.status;
    confirmDlg(isSelf?"Revoke your decision":"Revoke "+targetRole+"'s decision (override)",
      "This removes "+(isSelf?"your":targetRole+"'s")+" '"+prevDecision+"' decision on "+a.kind+". A reason is required and will be logged. "+
      (isOverride?"You are revoking this as LJS Strategic Approver override, not as the original decision-maker. ":"")+
      (prevStatus!=="Pending"?"This gate had already resolved as "+prevStatus+" — downstream changes already applied are not automatically undone.":""),
      "Revoke decision",(reason)=>{
        delete a.decisions[targetRole];
        recomputeApprovalStatus(a);
        audit(a.id,"Approval decision revoked",targetRole+": "+prevDecision,"Removed",
          reason+(isOverride?" (LJS override — original decision-maker: "+targetRole+")":""),
          isOverride?"Approval detail — LJS override revocation":"Approval detail — self-revocation");
        if(prevStatus!==a.status) audit(a.id,"Approval gate status changed",prevStatus,a.status,
          "Following "+(isOverride?"LJS override revocation of "+targetRole+"'s decision":"revocation by "+S.role),"Approval detail");
        save(); toast(isSelf?"Your decision was revoked and logged":targetRole+"'s decision was revoked and logged (LJS override)"); render();
      },true); },

/* approval side effects */
function recomputeApprovalStatus(a){
  const anyRej=Object.values(a.decisions).some(x=>x.d==="Reject");
  const anyRet=Object.values(a.decisions).some(x=>x.d==="Return for changes");
  const done=a.needed.every(n=>a.decisions[n]);
  if(anyRej) a.status="Rejected";
  else if(anyRet) a.status="Returned";
  else if(done) a.status=Object.values(a.decisions).some(x=>x.d==="Approve with conditions")?"Approved with conditions":"Approved";
  else a.status="Pending";
}
function applyApprovalEffects(a,dec){
  if(a.status==="Pending") return;
  const positive=a.status==="Approved"||a.status==="Approved with conditions";
  if(a.kind==="Red continuation"){
    const l=lead(a.leadId);
    if(a.status==="Rejected"){ l.status="Discarded"; audit(l.id,"Lead archived","Under Review","Discarded","Red gate rejection archives the lead","Approval"); }
    else if(positive){ l.status="Qualified";
      if(a.status==="Approved with conditions") audit(l.id,"Condition tasks created","—","Prepayment-only terms; end-user disclosure","Approve with conditions","Approval");
      audit(l.id,"Red continuation cleared","Blocked","Qualified","LJS + AH joint approval","Approval"); } }
  if(a.kind==="Amber continuation + fee"&&positive){ const o=opp(a.oppId); if(o){ o.health="At risk"; o.milestone="Screening"; o.nextAction="Complete screening then service estimate";
      audit(o.id,"Amber continuation cleared","Blocked","Screening","LJS + AH joint approval","Approval"); } }
  if(a.kind==="Resource feasibility"&&positive){ const sv=S.svcEstimates.find(s=>s.oppId===a.oppId); if(sv) sv.resourceApproval="Approved";
    audit(a.oppId,"Resource plan approved","Requested","Approved","AH gate","Approval"); }
  if(a.kind==="Technical deviation"&&positive){ const dv=S.deviations.find(x=>x.oppId===a.oppId); if(dv){ dv.status="Resolved"; dv.state="Comply"; }
    S.boq.forEach(b=>{ if(b.oppId===a.oppId&&b.compliance==="Partially Comply"){ b.status="accepted"; b.complianceNote=(b.complianceNote||"")+" — deviation approved (Technical + LJS)"; } });
    audit(a.oppId,"Technical deviation approved","Open","Resolved","Technical + LJS","Approval"); }
  if(a.kind==="Final quote release"){ const o=opp(a.oppId); const rev=o.revisions[o.revisions.length-1];
    if(positive){ rev.status="Released"; o.nextAction="Simulate send in Communications"; o.health="Good";
      audit(o.id,"Quote released",rev.rev,"Released","Final release by "+Object.keys(a.decisions).join("+"),"Approval"); }
    else if(a.status==="Returned"){ rev.status="Draft"; o.milestone="Proposal"; o.nextAction="Address return comments and resubmit";
      audit(o.id,"Release returned",rev.rev,"Draft","Return for changes","Approval"); }
    else if(a.status==="Rejected"){ rev.status="Rejected"; o.health="Blocked"; o.nextAction="Rework proposal per rejection";
      audit(o.id,"Release rejected",rev.rev,"Rejected","Rejection","Approval"); } }
}
